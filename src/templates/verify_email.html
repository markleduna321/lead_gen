<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta id="theme-color-meta" name="theme-color" content="#f5f7f9">
    <meta name="robots" content="noindex, nofollow">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Verify your email | diskubre</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='diskubre-logo.png') }}">
    <link rel="preload" href="{{ url_for('static', filename='vendor/fonts/dm-sans-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='vendor/fonts/manrope-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}">
    <script src="{{ url_for('static', filename='workspace.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <script src="{{ url_for('static', filename='account_email.js') }}" defer></script>
</head>
<body data-page="verify-email" class="auth-body">
    <main class="auth-shell" id="main-content">
        <section class="auth-card">
            <a class="brand" href="/"><img class="brand-logo" src="{{ url_for('static', filename='diskubre-logo.png') }}" alt=""><span>diskubre<small>LEAD WORKSPACE</small></span></a>
            <h1>Verify your email</h1>
            <p id="verify-status" class="auth-subtitle" role="status" aria-live="polite">Checking your link...</p>
            <p id="verify-error" class="auth-error" role="alert" hidden></p>
            <a id="verify-continue" class="primary-button auth-submit" href="/" hidden>Go to your workspace</a>
            <p class="auth-switch"><a href="{{ url_for('sign_in') }}">Sign in</a></p>
        </section>
    </main>
</body>
</html>
